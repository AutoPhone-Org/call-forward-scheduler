name: Auto Bump Version and Release

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump_and_release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Next Patch Version
        id: versioning
        run: |
          git fetch --tags --force

          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v0.1.0"
          else
            VERSION=${LATEST_TAG#v}
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          fi

          # 版本号给 APK 用（去掉 v 前缀）
          APP_VERSION=${NEW_TAG#v}
          # versionCode 用 Git 提交总数，保证正整数且单调递增
          VERSION_CODE=$(git rev-list --count HEAD)
          if [ -z "$VERSION_CODE" ] || [ "$VERSION_CODE" -lt 1 ]; then
            VERSION_CODE=1
          fi

          echo "Previous tag: ${LATEST_TAG:-none}"
          echo "New tag: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        env:
          VERSION_NAME: ${{ steps.versioning.outputs.app_version }}
          VERSION_CODE: ${{ steps.versioning.outputs.version_code }}
        run: gradle assembleRelease --no-daemon

      - name: Copy APK to stable name
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             dist/call-forward-scheduler-${{ steps.versioning.outputs.new_tag }}.apk

      - name: Generate Release Notes with Multi-Mirrors
        run: |
          REPO="${{ github.repository }}"
          TAG="${{ steps.versioning.outputs.new_tag }}"
          FILE="call-forward-scheduler-${TAG}.apk"
          OFFICIAL="https://github.com/${REPO}/releases/download/${TAG}/${FILE}"

          cat > release_note.md <<EOF
          ## 自动发布版本 ${TAG}

          ### 下载通道

          | 节点 | 下载链接 |
          | :--- | :--- |
          | GitHub 官方源 | [${FILE}](${OFFICIAL}) |
          | ghfast 加速 | [高速下载](https://ghfast.top/${OFFICIAL}) |
          | ghproxy 加速 | [高速下载](https://ghproxy.net/${OFFICIAL}) |
          | moeyy 加速 | [高速下载](https://github.moeyy.xyz/${OFFICIAL}) |

          提示：若某个加速站不可用，请切换其他节点；APK 由 CI 使用 debug 签名构建，仅用于测试安装。
          EOF

      - name: Create Git Tag and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.versioning.outputs.new_tag }}"
          git push origin "${{ steps.versioning.outputs.new_tag }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.new_tag }}
          name: Release ${{ steps.versioning.outputs.new_tag }}
          body_path: release_note.md
          files: dist/call-forward-scheduler-${{ steps.versioning.outputs.new_tag }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
